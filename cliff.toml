# Keep a Changelog layout, with categories matched to SubLane's Conventional Commits.
[changelog]
header = """
# Changelog

All notable changes are documented here in [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) format.

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.breaking_description %} — {{ commit.breaking_description | trim }}{% endif %}
{% endfor -%}
{% endfor %}
"""
footer = """

{% for release in releases -%}
{% if release.version and release.previous and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}...{{ release.version }}
{% elif release.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/releases/tag/{{ release.version }}
{% elif release.previous and release.previous.version -%}
[Unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}...HEAD
{% else -%}
[Unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Internal maintenance can be omitted, but breaking changes must remain visible.
# Hidden numeric prefixes preserve Keep a Changelog's category order.
commit_parsers = [
    { message = '^(security|[a-z]+\(security\))!?[:]', group = "<!-- 6 -->Security" },
    { field = "breaking", pattern = "true", group = "<!-- 2 -->Changed" },
    { message = '^([a-z]+(\([^)]*\))?!?: )?(deprecate|deprecated)\b', group = "<!-- 3 -->Deprecated" },
    { message = '^[a-z]+(\([^)]*\))?!?: (remove|delete)\b', group = "<!-- 4 -->Removed" },
    { message = '^feat', group = "<!-- 1 -->Added" },
    { message = '^fix', group = "<!-- 5 -->Fixed" },
    { message = '^(docs|test|style|chore)(\([^)]*\))?:', skip = true },
    { message = '^.*', group = "<!-- 2 -->Changed" },
]
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
topo_order = true
sort_commits = "oldest"

[remote.github]
owner = "murongg"
repo = "SubLane"
